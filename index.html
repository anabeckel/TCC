<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de PRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#eceff3;--panel:#fff;--ink:#17202c;--mute:#5b697a;--line:#d3dae3;--accent:#2447c8;--accent-ink:#fff;--field:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--bg:#0e131a;--panel:#161d27;--ink:#e5eaf0;--mute:#94a2b4;--line:#2a3443;--accent:#7aa2ff;--accent-ink:#0b1220;--field:#0e131a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font:600 17px "IBM Plex Sans",system-ui,sans-serif;margin:0 auto 0 0}
#st{font-size:13px;color:var(--mute);min-width:110px}
.btn{font:500 13px "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;max-width:1280px;margin:0 auto;padding:24px 20px 48px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.blk h2{font-size:16px;font-weight:600;margin:0 0 2px}
.hint{margin:0 0 10px;font-size:13px;color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 3px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;gap:6px;margin-bottom:6px}
.x{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:6px;cursor:pointer;font-size:18px;line-height:1}
.x:hover{color:var(--ink);border-color:var(--mute)}
.add{font:500 13px "IBM Plex Sans",system-ui,sans-serif;color:var(--accent);background:none;border:0;padding:6px 0;cursor:pointer}
#pv{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;align-self:start}
.paper{background:#fff;color:#1b1b1b;font:400 15px/1.65 "Source Serif 4",Georgia,serif;padding:48px 52px;min-height:620px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 14px 34px -14px rgba(0,0,0,.35)}
.paper h1{font:700 28px/1.2 "Source Serif 4",Georgia,serif;margin:0 0 14px}
.paper h2{font:600 18px/1.3 "Source Serif 4",Georgia,serif;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid #cfcfcf}
.paper p{margin:0 0 10px}
.paper ul{margin:0 0 10px;padding-left:22px}
.paper table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.paper th,.paper td{border:1px solid #cfcfcf;padding:5px 8px;text-align:left;vertical-align:top}
.paper th{background:#f0f0f0}
.paper .empty{color:#777;font-style:italic}
.ai textarea{margin-bottom:8px}.ai .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ai .err{color:#d64545;font-size:13px}.ai #ai-keybox{margin-bottom:8px}.ai .g2{margin-bottom:10px}
@media (max-width:900px){main{grid-template-columns:1fr}#pv{position:static;max-height:none}.paper{padding:28px 22px}}
@media print{header,#left{display:none}body{background:#fff}main{display:block;padding:0;max-width:none}#pv{position:static;max-height:none;overflow:visible}.paper{box-shadow:none;padding:0;min-height:0}}
</style>
</head>
<body>
<header>
  <h1>Gerador de PRD</h1>
  <span id="st" role="status"></span>
  <button class="btn" id="b-ex" type="button">Preencher exemplo</button>
  <button class="btn" id="b-clr" type="button">Limpar</button>
  <button class="btn" id="b-rc" type="button">Copiar formatado</button>
  <button class="btn" id="b-cp" type="button">Copiar Markdown</button>
  <button class="btn" id="b-dl" type="button">Baixar .md</button>
  <button class="btn primary" id="b-pr" type="button">Imprimir / salvar PDF</button>
</header>
<main>
  <div id="left">
    <section class="blk ai">
      <h2>Gerar com IA</h2>
      <p class="hint">Descreva a ideia em português ou inglês e a IA preenche o PRD inteiro. Depois você revisa e edita cada campo.</p>
      <div class="g2">
        <div><label for="ai-level">Nível do PRD</label><select id="ai-level"><option value="enxuto">Enxuto (1 a 2 páginas)</option><option value="completo">Completo (stories, dependências)</option></select></div>
        <div><label for="ai-lang">Idioma do documento</label><select id="ai-lang"><option value="auto">Automático (pelo seu texto)</option><option value="pt">Português</option><option value="en">English</option></select></div>
      </div>
      <textarea id="ai-ideia" rows="4" aria-label="Ideia do produto" placeholder="Ex.: Adicionar pagamento via Pix no checkout do nosso marketplace para reduzir o abandono de carrinho no mobile. Meta: +5% de conversão."></textarea>
      <div id="ai-keybox">
        <label for="ai-key">Chave de API do Google Gemini</label>
        <input id="ai-key" type="password" autocomplete="off" placeholder="AIza…">
        <p class="hint">Fica só neste navegador (apagada ao fechar a aba) e é enviada apenas para o Google. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Crie uma de graça no Google AI Studio</a>.</p>
      </div>
      <div class="row2"><button class="btn primary" id="ai-go" type="button">Gerar PRD com IA</button><span class="err" id="ai-err" role="alert"></span></div>
    </section>
    <div id="form"></div>
  </div>
  <div id="pv"><article class="paper" id="paper"></article></div>
</main>
<script>
const KEY='prd-pm-v1';
const META=[['produto','Produto ou feature','Ex.: Checkout com Pix'],['autor','Autor(a)','Seu nome (PM)'],['time','Time / squad',''],['versao','Versão','1.0']];
const PRI=['Essencial','Importante','Desejável'];
const CAT=['Desempenho','Usabilidade','Segurança','Acessibilidade','Compatibilidade','Outro'];
const EN={Essencial:'Must have',Importante:'Should have','Desejável':'Could have',Desempenho:'Performance',Usabilidade:'Usability','Segurança':'Security',Acessibilidade:'Accessibility',Compatibilidade:'Compatibility',Outro:'Other'};
const one=(id,t,h,ph,add,full)=>({id,t,type:'list',h,cols:[{ph}],add,full});
const SEC=[
{id:'visao',t:['Resumo executivo','Executive summary'],type:'text',h:'Em 2 a 4 frases: o que é, para quem e qual resultado se espera.',ph:'O [produto] permite que [público] [faça algo], para [resultado].'},
{id:'problema',t:['Problema e contexto','Problem and context'],type:'text',h:'Qual dor existe hoje, evidências e por que vale resolver agora.',ph:'Hoje, [público] enfrenta [problema], o que causa [consequência].'},
one('publico',['Usuários e personas','Users and personas'],'Quem vai usar. Uma linha por persona, com perfil e contexto de uso.','Ex.: Comprador mobile, 25 a 40 anos, compra recorrente','Adicionar persona'),
one('objetivos',['Objetivos','Goals'],'O que o produto precisa alcançar. Prefira resultados mensuráveis.','Ex.: Reduzir o abandono de carrinho no pagamento','Adicionar objetivo'),
one('metricas',['Métricas de sucesso','Success metrics'],'Como saber que deu certo (conversão, retenção, NPS, tempo de tarefa).','Ex.: Conversão do checkout +5% em 90 dias','Adicionar métrica'),
{id:'stories',t:['User stories','User stories'],type:'list',full:true,h:'Quem quer o quê e por quê, com um critério de aceite verificável. Códigos US01, US02… são automáticos.',cols:[{ph:'Como [persona], quero [ação] para [benefício]'},{ph:'Critério de aceite'}],add:'Adicionar história',table:{head:[['ID','História','Critério de aceite'],['ID','Story','Acceptance criteria']],id:'US'}},
{id:'rf',t:['Requisitos funcionais','Functional requirements'],type:'list',h:'O que o sistema faz. Códigos RF01, RF02… são automáticos. Prioridade no estilo MoSCoW.',cols:[{ph:'O sistema deve permitir…'},{sel:PRI,w:'112px',lbl:'Prioridade'}],add:'Adicionar requisito',table:{head:[['ID','Requisito','Prioridade'],['ID','Requirement','Priority']],id:'RF'}},
{id:'rnf',t:['Requisitos não funcionais','Non-functional requirements'],type:'list',full:true,key:1,h:'Como o sistema deve se comportar: desempenho, segurança, usabilidade.',cols:[{sel:CAT,w:'140px',lbl:'Categoria'},{ph:'Ex.: Confirmar o pagamento em até 3 segundos'}],add:'Adicionar requisito',table:{head:[['ID','Categoria','Requisito'],['ID','Category','Requirement']],id:'RNF'}},
one('fora',['Fora do escopo','Out of scope'],'O que não será feito nesta versão. Ajuda a proteger o escopo.','Ex.: Pix parcelado','Adicionar item'),
one('dependencias',['Dependências','Dependencies'],'Times, sistemas ou fornecedores de que a entrega depende.','Ex.: API do provedor de pagamento','Adicionar dependência',true),
one('riscos',['Premissas e riscos','Assumptions and risks'],'O que você assume como verdadeiro e o que pode atrapalhar.','Ex.: Risco: instabilidade do provedor no pico de vendas','Adicionar item'),
one('perguntas',['Perguntas em aberto','Open questions'],'O que ainda não foi decidido e quem precisa responder.','Ex.: O Pix terá desconto como incentivo?','Adicionar pergunta',true),
{id:'marcos',t:['Cronograma e marcos','Timeline and milestones'],type:'list',h:'Etapas e prazos até o lançamento.',cols:[{ph:'Etapa'},{ph:'Prazo, ex.: semana 4',w:'150px'}],add:'Adicionar etapa',table:{head:[['Etapa','Prazo'],['Milestone','Target date']]}}
];
const blank=s=>s.cols.map(c=>c.sel?c.sel[0]:'');
const $=id=>document.getElementById(id);
const form=$('form'),pv=$('paper');

function h(t,a={},...c){const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e}

function fresh(){const l={};SEC.forEach(s=>{if(s.type==='list')l[s.id]=[blank(s)]});return{meta:{},text:{},list:l,level:'enxuto',langMode:'auto'}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.meta&&r.text&&r.list){r.level=r.level||'enxuto';r.langMode=r.langMode||'auto';SEC.forEach(s=>{if(s.type==='list'&&!(Array.isArray(r.list[s.id])&&r.list[s.id].length))r.list[s.id]=[blank(s)]});return r}}catch(e){}return fresh()}
let st=load();

let raf;
function upd(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{pv.innerHTML=html(md());try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}})}

function listUI(s){
  const box=h('div');
  const draw=()=>{
    box.replaceChildren();
    st.list[s.id].forEach((row,i)=>{
      const r=h('div',{class:'row',style:'grid-template-columns:'+s.cols.map(c=>c.w||(c.sel?'130px':'1fr')).join(' ')+' 34px'});
      s.cols.forEach((c,j)=>{
        let el;
        if(c.sel){el=h('select',{'aria-label':c.lbl||'Opção'},c.sel.map(o=>h('option',{},o)));el.value=row[j]}
        else el=h('input',{type:'text',placeholder:c.ph,value:row[j],'aria-label':c.ph});
        el.oninput=el.onchange=e=>{row[j]=e.target.value;upd()};
        r.append(el);
      });
      r.append(h('button',{class:'x',type:'button','aria-label':'Remover item',onclick:()=>{st.list[s.id].splice(i,1);if(!st.list[s.id].length)st.list[s.id].push(blank(s));draw();upd()}},'×'));
      box.append(r);
    });
  };
  draw();
  return h('div',{},box,h('button',{class:'add',type:'button',onclick:()=>{st.list[s.id].push(blank(s));draw();upd();const f=box.querySelector('.row:last-child input');if(f)f.focus()}},'+ '+s.add));
}

function build(){
  form.replaceChildren();
  form.append(h('section',{class:'blk'},h('h2',{},'Identificação'),h('p',{class:'hint'},'Salvo automaticamente neste navegador.'),
    h('div',{class:'g2'},META.map(([k,l,ph])=>h('div',{},h('label',{for:'m-'+k},l),h('input',{id:'m-'+k,type:'text',placeholder:ph,value:st.meta[k]||'',oninput:e=>{st.meta[k]=e.target.value;upd()}}))))));
  SEC.forEach(s=>{
    if(s.full&&st.level!=='completo')return;
    form.append(h('section',{class:'blk'},h('h2',{},s.t[0]),h('p',{class:'hint'},s.h),
      s.type==='text'?h('textarea',{rows:4,'aria-label':s.t[0],placeholder:s.ph||'',oninput:e=>{st.text[s.id]=e.target.value;upd()}},st.text[s.id]||''):listUI(s)));
  });
  $('ai-level').value=st.level;$('ai-lang').value=st.langMode;
}

function detect(){
  const t=' '+[st.meta.produto,st.text.visao,st.text.problema,$('ai-ideia').value].concat(Object.values(st.list).flat(2)).join(' ').toLowerCase()+' ';
  const en=(t.match(/\b(the|and|to|of|for|with|that|is|are|users?|should|will|can|we|our|this|from|their|have)\b/g)||[]).length;
  const pt=(t.match(/\b(de|do|da|dos|das|para|com|que|em|um|uma|não|os|as|por|ser|usuários?|deve|nosso|nossa|são|mais)\b/g)||[]).length;
  return en>pt?'en':'pt';
}
const lang=()=>st.langMode==='auto'?detect():st.langMode;

function md(){
  const en=lang()==='en',m=st.meta,L=['# PRD: '+((m.produto||'').trim()||(en?'Product name':'Nome do produto')),''];
  [[en?'Author':'Autor(a)',m.autor],[en?'Team':'Time',m.time],[en?'Version':'Versão',m.versao],[en?'Date':'Data',new Date().toLocaleDateString(en?'en-US':'pt-BR')]].forEach(([k,v])=>{if(v&&v.trim())L.push('- **'+k+':** '+v.trim())});
  L.push('');
  let n=0;
  SEC.forEach(s=>{
    if(s.full&&st.level!=='completo')return;
    const b=[];
    if(s.type==='text'){const v=(st.text[s.id]||'').trim();if(v)b.push(v)}
    else{
      const rows=st.list[s.id].filter(r=>(r[s.key||0]||'').trim());
      if(rows.length){
        if(s.table){
          const cl=x=>String(en&&EN[x]?EN[x]:x).replace(/\|/g,'/').replace(/\s+/g,' ').trim();
          const hd=s.table.head[en?1:0];
          b.push('| '+hd.join(' | ')+' |','|'+hd.map(()=>'---').join('|')+'|');
          rows.forEach((r,i)=>b.push('| '+(s.table.id?[s.table.id+String(i+1).padStart(2,'0')]:[]).concat(r).map(cl).join(' | ')+' |'));
        }else rows.forEach(r=>b.push('- '+r[0].trim()));
      }
    }
    if(b.length){n++;L.push('## '+n+'. '+s.t[en?1:0],'',...b,'')}
  });
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function html(src){
  const ls=src.split('\n');let o='',i=0;
  while(i<ls.length){
    const l=ls[i];
    if(l.startsWith('# ')){o+='<h1>'+inl(l.slice(2))+'</h1>';i++}
    else if(l.startsWith('## ')){o+='<h2>'+inl(l.slice(3))+'</h2>';i++}
    else if(l.startsWith('- ')){o+='<ul>';while(i<ls.length&&ls[i].startsWith('- ')){o+='<li>'+inl(ls[i].slice(2))+'</li>';i++}o+='</ul>'}
    else if(l.startsWith('|')){
      const rs=[];while(i<ls.length&&ls[i].startsWith('|')){rs.push(ls[i]);i++}
      const cells=r=>r.slice(1,-1).split('|').map(c=>c.trim());
      o+='<table><thead><tr>'+cells(rs[0]).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rs.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    }
    else if(!l.trim()){i++}
    else{const p=[];while(i<ls.length&&ls[i].trim()&&!/^(#|- |\|)/.test(ls[i])){p.push(ls[i]);i++}o+='<p>'+inl(p.join(' '))+'</p>'}
  }
  if(!/<h2>/.test(o))o+='<p class="empty">Preencha os campos ao lado e as seções do documento aparecem aqui.</p>';
  return o;
}

let tm;
function msg(t){const e=$('st');e.textContent=t;clearTimeout(tm);tm=setTimeout(()=>e.textContent='',2500)}
async function cp(){
  try{await navigator.clipboard.writeText(md())}
  catch(e){const t=h('textarea',{},md());document.body.append(t);t.select();document.execCommand('copy');t.remove()}
  msg('Markdown copiado.');
}
function dl(){
  const slug=((st.meta.produto||'produto')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'produto';
  const a=h('a',{href:URL.createObjectURL(new Blob([md()],{type:'text/markdown;charset=utf-8'})),download:'prd-'+slug+'.md'});
  document.body.append(a);a.click();a.remove();msg('Arquivo baixado.');
}
function example(){
  if(!confirm('Substituir o conteúdo atual pelo exemplo?'))return;
  st={meta:{produto:'Checkout com Pix',autor:'Seu nome',time:'Squad Pagamentos',versao:'1.0'},level:'completo',langMode:'auto',
  text:{visao:'Adicionar o Pix como forma de pagamento no checkout do marketplace, com confirmação em tempo real, para reduzir o abandono de carrinho no mobile.',
  problema:'Boa parte dos carrinhos iniciados no mobile é abandonada na etapa de pagamento, e a falta do Pix aparece como um dos principais motivos nas pesquisas com compradores. Isso significa receita perdida e custo de aquisição desperdiçado.'},
  list:{publico:[['Comprador mobile, 25 a 40 anos, compra recorrente e prefere pagar com Pix'],['Vendedor que acompanha a confirmação do pagamento para despachar o pedido']],
  objetivos:[['Reduzir o abandono de carrinho na etapa de pagamento'],['Disponibilizar o Pix no app e no site até o fim do trimestre']],
  metricas:[['Conversão do checkout mobile +5% em 90 dias'],['Mais de 95% dos pagamentos Pix confirmados em até 10 segundos']],
  stories:[['Como comprador, quero pagar com Pix para finalizar a compra sem digitar dados de cartão','O QR code e o código copia e cola aparecem em até 2 segundos'],['Como vendedor, quero ser notificado quando o Pix for confirmado para despachar o pedido','O status do pedido muda para pago em até 10 segundos após a confirmação']],
  rf:[['Exibir o Pix como opção de pagamento no checkout','Essencial'],['Gerar QR code e código copia e cola com validade de 30 minutos','Essencial'],['Confirmar o pagamento automaticamente via webhook do provedor','Essencial'],['Permitir reembolso total do Pix pelo painel de suporte','Importante'],['Enviar lembrete antes do QR code expirar','Desejável']],
  rnf:[['Desempenho','Gerar o QR code em até 2 segundos no percentil 95'],['Segurança','Assinar e validar todos os webhooks do provedor']],
  fora:[['Pix parcelado'],['Pix por aproximação']],
  dependencias:[['API de Pix do provedor de pagamento'],['Time de Antifraude, para ajustar as regras de risco']],
  riscos:[['Risco: instabilidade do provedor no pico de vendas'],['Premissa: o provedor já foi homologado pelo time financeiro']],
  perguntas:[['Qual a política de reembolso para pedidos parcialmente cancelados?'],['O Pix terá desconto como incentivo?']],
  marcos:[['Discovery e desenho','semana 1'],['Integração com o provedor','semanas 2 a 4'],['Beta com 10% dos usuários','semana 5'],['Lançamento geral','semana 7']]}};
  build();upd();
}
function clear(){if(!confirm('Apagar todo o conteúdo?'))return;st=fresh();build();upd()}

// ---- IA ----
// Cole aqui a URL do seu Cloudflare Worker (veja worker.js). Vazio = cada visitante usa a própria chave de API.
const PROXY_URL='https://gerador-prd.analuuq.workers.dev';
const MODEL='gemini-3.5-flash-lite'; // confira o nome atual em ai.google.dev/gemini-api/docs/models
const prompt=(nivel,idioma)=>`Você é um gerente de produto sênior. Com base na ideia do usuário, escreva um PRD e responda SOMENTE com um JSON válido, sem markdown, neste formato: {"produto":"","visao":"","problema":"","publico":[""],"objetivos":[""],"metricas":[""],"stories":[["Como [persona], quero [ação] para [benefício]","critério de aceite"]],"rf":[["requisito","Essencial|Importante|Desejável"]],"rnf":[["Desempenho|Usabilidade|Segurança|Acessibilidade|Compatibilidade|Outro","requisito"]],"fora":[""],"dependencias":[""],"riscos":[""],"perguntas":[""],"marcos":[["etapa","prazo"]]}. ${idioma==='en'?'Escreva todos os textos em inglês.':idioma==='pt'?'Escreva todos os textos em português do Brasil.':'Escreva todos os textos no mesmo idioma da ideia do usuário.'} Use linguagem objetiva e profissional. Nos campos rf e rnf, use exatamente os valores de prioridade e categoria listados no formato, mesmo que o texto esteja em outro idioma. ${nivel==='completo'?'Nível COMPLETO: gere 2 a 3 personas, 3 a 4 objetivos, 3 a 4 métricas mensuráveis, 4 a 6 user stories com critérios de aceite verificáveis, 6 a 10 requisitos funcionais, 3 a 5 não funcionais, 3 itens fora do escopo, 3 dependências, 3 riscos ou premissas, 3 a 5 perguntas em aberto e 4 a 5 marcos.':'Nível ENXUTO: gere apenas produto, visao, problema, 2 personas, 3 objetivos, 3 métricas, 5 a 7 requisitos funcionais, 3 itens fora do escopo, 3 riscos ou premissas e 4 marcos; deixe stories, rnf, dependencias e perguntas como listas vazias.'} Hoje é ${new Date().toLocaleDateString('pt-BR')}.`;

function aplicar(j){
  const arr=a=>Array.isArray(a)?a:[];
  const s=x=>typeof x==='string'?x:'';
  const f=fresh();
  f.meta=Object.assign({},st.meta);f.level=st.level;f.langMode=st.langMode;
  if(s(j.produto).trim())f.meta.produto=j.produto.trim();
  f.text={visao:s(j.visao),problema:s(j.problema)};
  const put=(k,l)=>{if(l.length)f.list[k]=l};
  ['publico','objetivos','metricas','fora','dependencias','riscos','perguntas'].forEach(k=>put(k,arr(j[k]).map(s).filter(x=>x.trim()).map(x=>[x])));
  put('stories',arr(j.stories).filter(r=>Array.isArray(r)&&s(r[0]).trim()).map(r=>[s(r[0]),s(r[1])]));
  put('rf',arr(j.rf).filter(r=>Array.isArray(r)&&s(r[0]).trim()).map(r=>[s(r[0]),PRI.includes(r[1])?r[1]:PRI[1]]));
  put('rnf',arr(j.rnf).filter(r=>Array.isArray(r)&&s(r[1]).trim()).map(r=>[CAT.includes(r[0])?r[0]:'Outro',s(r[1])]));
  put('marcos',arr(j.marcos).filter(r=>Array.isArray(r)&&s(r[0]).trim()).map(r=>[s(r[0]),s(r[1])]));
  st=f;build();upd();
}

async function gerar(){
  const ideia=$('ai-ideia').value.trim(),btn=$('ai-go'),err=$('ai-err');
  err.textContent='';
  if(ideia.length<15){err.textContent='Descreva a ideia com pelo menos uma frase.';return}
  const key=$('ai-key').value.trim();
  if(!PROXY_URL&&!key){err.textContent='Cole sua chave de API do Gemini para gerar.';return}
  btn.disabled=true;btn.textContent='Gerando…';
  try{
    let txt;
    if(PROXY_URL){
      const r=await fetch(PROXY_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideia,nivel:st.level,idioma:st.langMode})});
      if(!r.ok)throw new Error(await r.text()||r.status);
      txt=(await r.json()).text;
    }else{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:prompt(st.level,st.langMode)}]},contents:[{role:'user',parts:[{text:ideia}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:8192}})});
      const d=await r.json();
      if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);
      txt=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
    }
    aplicar(JSON.parse(txt.replace(/^```(?:json)?|```$/gm,'').trim()));
    msg('PRD gerado. Revise e ajuste.');
  }catch(e){err.textContent='Não foi possível gerar: '+e.message}
  finally{btn.disabled=false;btn.textContent='Gerar PRD com IA'}
}

async function cpRich(){
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([pv.innerHTML],{type:'text/html'}),'text/plain':new Blob([md()],{type:'text/plain'})})])}
  catch(e){const r=document.createRange();r.selectNodeContents(pv);const g=getSelection();g.removeAllRanges();g.addRange(r);document.execCommand('copy');g.removeAllRanges()}
  msg('Copiado com formatação.');
}

if(PROXY_URL)$('ai-keybox').hidden=true;
try{$('ai-key').value=sessionStorage.getItem('ak')||''}catch(e){}
$('ai-key').oninput=e=>{try{sessionStorage.setItem('ak',e.target.value)}catch(_){}};
$('ai-go').onclick=gerar;
$('ai-level').onchange=e=>{st.level=e.target.value;build();upd()};
$('ai-lang').onchange=e=>{st.langMode=e.target.value;upd()};

$('b-cp').onclick=cp;$('b-rc').onclick=cpRich;$('b-dl').onclick=dl;$('b-pr').onclick=()=>window.print();$('b-ex').onclick=example;$('b-clr').onclick=clear;
build();upd();
</script>
